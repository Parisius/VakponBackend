# Nginx config for api.vakpon-tours.com — reverse-proxies to the API
# container, which docker-compose.yml binds to 127.0.0.1:3001 only (never
# exposed directly to the public internet).
#
# Deploy: drop this file at /etc/nginx/sites-available/api.vakpon-tours.com and:
#   ln -s /etc/nginx/sites-available/api.vakpon-tours.com /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d api.vakpon-tours.com
#
# Certbot will add the HTTPS server block and the HTTP → HTTPS redirect
# automatically the first time it runs.

server {
    listen 80;
    listen [::]:80;
    server_name api.vakpon-tours.com;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
