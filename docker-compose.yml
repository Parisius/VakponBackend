services:
  mongo:
    image: mongo:7
    container_name: vakpon-mongo
    restart: unless-stopped
    ports:
      # Bound to localhost only — Mongo must never face the public internet
      # directly. On the VPS this is still reachable via an SSH tunnel.
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-data:/data/db

  api:
    build:
      context: .
    container_name: vakpon-api
    restart: unless-stopped
    depends_on:
      - mongo
    env_file:
      - ./.env
    environment:
      # Overrides whatever is in .env — inside Docker the API must reach
      # Mongo by service name, not localhost.
      MONGODB_URI: mongodb://mongo:27017/vakpon-tours
    ports:
      # Published on all interfaces — if your reverse proxy (e.g. Nginx Proxy
      # Manager) runs in its own container rather than sharing a Docker
      # network with this stack, it can only reach this port via the VPS's
      # real IP, not 127.0.0.1 (that's the proxy container's own loopback).
      # The API requires JWT auth on everything except GET /offers,
      # POST /reservations/public, and POST /auth/login|register, so direct
      # exposure is a much smaller risk than it looks — but if you'd rather
      # close it off entirely, join this stack to your proxy's Docker network
      # instead and drop this ports mapping (see backend/README.md).
      - "3001:3000"

  # Dev-convenience DB viewer. Bound to localhost only — on the VPS, reach it
  # via an SSH tunnel (ssh -L 8081:localhost:8081 you@vps) rather than exposing
  # it publicly. Change the default admin/admin login before relying on this
  # in production, or just stop this service (docker compose stop mongo-express)
  # when you're not actively using it.
  mongo-express:
    image: mongo-express:1
    container_name: vakpon-mongo-express
    restart: unless-stopped
    depends_on:
      - mongo
    environment:
      ME_CONFIG_MONGODB_SERVER: mongo
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: admin
    ports:
      - "127.0.0.1:8081:8081"

volumes:
  mongo-data:
