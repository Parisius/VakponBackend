services:
  mongo:
    image: mongo:7
    container_name: vakpon-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  api:
    build:
      context: .
    container_name: vakpon-api
    restart: unless-stopped
    depends_on:
      - mongo
    env_file:
      - ./.env
    environment:
      # Overrides whatever is in .env — inside Docker the API must reach
      # Mongo by service name, not localhost.
      MONGODB_URI: mongodb://mongo:27017/vakpon-tours
    ports:
      - "3001:3000"

  # Optional: a lightweight web UI to browse the database during development.
  # Remove this service for production deployments.
  mongo-express:
    image: mongo-express:1
    container_name: vakpon-mongo-express
    restart: unless-stopped
    depends_on:
      - mongo
    environment:
      ME_CONFIG_MONGODB_SERVER: mongo
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: admin
    ports:
      - "8081:8081"

volumes:
  mongo-data:
